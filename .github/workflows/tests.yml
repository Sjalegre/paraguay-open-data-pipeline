name: tests

# The unit suite runs entirely offline against fixtures reproduced from the
# real files, so CI never depends on datos.gov.py being up. The warehouse
# integration tests skip themselves when no warehouse has been built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: Tests
        run: python -m pytest -q
